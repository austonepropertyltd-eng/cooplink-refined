[versions]
agp                    = "8.5.2"
kotlin                 = "2.0.21"
ksp                    = "2.0.21-1.0.27"
coreKtx                = "1.13.1"
lifecycleRuntimeKtx    = "2.8.7"
activityCompose        = "1.9.3"
composeBom             = "2024.11.00"
navigationCompose      = "2.8.4"
hilt                   = "2.52"
hiltNavigationCompose  = "1.2.0"
room                   = "2.6.1"
datastore              = "1.1.1"
supabase               = "3.0.2"
ktor                   = "3.0.1"
coil                   = "2.7.0"
vico                   = "2.0.0-alpha.26"
firebaseBom            = "33.6.0"
coroutines             = "1.9.0"
splashscreen           = "1.0.1"
biometric              = "1.2.0-alpha05"
workmanager            = "2.10.0"
paging                 = "3.3.4"
kotlinxSerialization   = "1.7.3"
googleServices         = "4.4.2"
firebaseCrashlyticsPlugin = "3.0.2"
junit                  = "4.13.2"
junitExt               = "1.2.1"
espresso               = "3.6.1"
turbine                = "1.2.0"
mockitoKotlin          = "5.4.0"

[libraries]
# AndroidX Core
androidx-core-ktx                    = { group = "androidx.core",     name = "core-ktx",                   version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",      version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",  version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose            = { group = "androidx.activity",  name = "activity-compose",           version.ref = "activityCompose" }
splashscreen                         = { group = "androidx.core",      name = "core-splashscreen",          version.ref = "splashscreen" }

# Compose BOM
androidx-compose-bom              = { group = "androidx.compose",    name = "compose-bom",             version.ref = "composeBom" }
androidx-ui                       = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics              = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling               = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview       = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest         = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4           = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3                = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended  = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt
hilt-android           = { group = "com.google.dagger", name = "hilt-android",           version.ref = "hilt" }
hilt-compiler          = { group = "com.google.dagger", name = "hilt-android-compiler",  version.ref = "hilt" }
hilt-navigation-compose= { group = "androidx.hilt",    name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
hilt-work              = { group = "androidx.hilt",    name = "hilt-work",               version.ref = "hiltNavigationCompose" }
androidx-hilt-compiler = { group = "androidx.hilt",    name = "hilt-compiler",           version.ref = "hiltNavigationCompose" }

# Room
room-runtime  = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",     version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-paging   = { group = "androidx.room", name = "room-paging",   version.ref = "room" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Supabase BOM
supabase-bom       = { group = "io.github.jan-tennert.supabase", name = "bom",            version.ref = "supabase" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-auth      = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-realtime  = { group = "io.github.jan-tennert.supabase", name = "realtime-kt" }
supabase-storage   = { group = "io.github.jan-tennert.supabase", name = "storage-kt" }
supabase-functions = { group = "io.github.jan-tennert.supabase", name = "functions-kt" }

# Ktor (required by Supabase)
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",    version.ref = "coroutines" }

# Image
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Charts
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# Firebase
firebase-bom          = { group = "com.google.firebase", name = "firebase-bom",               version.ref = "firebaseBom" }
firebase-analytics    = { group = "com.google.firebase", name = "firebase-analytics-ktx" }
firebase-crashlytics  = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" }
firebase-messaging    = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

# Biometric
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# WorkManager
workmanager = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }

# Paging
paging-runtime  = { group = "androidx.paging", name = "paging-runtime",  version.ref = "paging" }
paging-compose  = { group = "androidx.paging", name = "paging-compose",  version.ref = "paging" }

# Testing
junit             = { group = "junit",                name = "junit",          version.ref = "junit" }
junit-ext         = { group = "androidx.test.ext",   name = "junit",          version.ref = "junitExt" }
espresso-core     = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
turbine           = { group = "app.cash.turbine",    name = "turbine",        version.ref = "turbine" }
mockito-kotlin    = { group = "org.mockito.kotlin",  name = "mockito-kotlin", version.ref = "mockitoKotlin" }

[plugins]
android-application     = { id = "com.android.application",                    version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
hilt                    = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
ksp                     = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
google-services         = { id = "com.google.gms.google-services",             version.ref = "googleServices" }
firebase-crashlytics    = { id = "com.google.firebase.crashlytics",            version.ref = "firebaseCrashlyticsPlugin" }
